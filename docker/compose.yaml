name: manverse

services:
  # TODO: Implement or use the API container
  # manverse-api:
  #   container-name: manverse_api
  #   image:

  api-db:
    container_name: api-db
    image: postgres:18.3-alpine3.23
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      # Uncomment if you are not storing it on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - 'api-vol:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_DATABASE_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    
volumes:
  api-vol: